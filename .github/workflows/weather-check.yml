name: Check Weather Alerts

on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  check-weather:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install requests
      
      - name: Check weather and air quality
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          WAQI_API_TOKEN: ${{ secrets.WAQI_API_TOKEN }}
        run: python weather_check.py
      
      - name: Commit updated tracking files
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add posted_alerts.txt posted_aqi.txt
          git diff --quiet && git diff --staged --quiet || git commit -m "Update tracking files"
          git push
