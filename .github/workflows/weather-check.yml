name: Check Weather Alerts

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  check-weather:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install requests
      
      - name: Check for weather alerts
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python weather_check.py
      
      - name: Update tracking and schedule next run
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Update last run timestamp
          echo "$(date -u +"%Y-%m-%d %H:%M:%S UTC")" > .last_run
          
          # Add both files
          git add posted_alerts.txt .last_run
          
          # Commit if there are changes
          git diff --quiet && git diff --staged --quiet || git commit -m "Automated weather check"
          
          # Wait 1 hour before pushing (triggers next run)
          echo "Waiting 1 hour before next check..."
          sleep 3600
          
          git push
