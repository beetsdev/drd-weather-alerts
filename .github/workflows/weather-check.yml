name: Check Weather Alerts

on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:

jobs:
  check-weather:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install requests
      
      - name: Check for weather alerts
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python weather_check.py
      
      - name: Commit updated alert tracking
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add posted_alerts.txt
          git diff --quiet && git diff --staged --quiet || git commit -m "Update posted alerts tracking"
          git push
